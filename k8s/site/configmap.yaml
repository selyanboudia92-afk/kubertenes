# 1. Modifier le texte de configmap.yaml
cat <<'EOF' > k8s/site/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: site-html
data:
  index.html: |
    <!doctype html>
    <html lang="fr">
      <head><meta charset="utf-8"><title>Mon site sur Kubernetes</title></head>
      <body>
        <h1>Bienvenue sur mon site (Version 2)</h1>
        <p>Réalisé par Selyan Boudia — Mis à jour de manière déclarative !</p>
        <p>Servi par Kubernetes.</p>
      </body>
    </html>
EOF

# 2. Appliquer le changement et forcer le redémarrage du pod
kubectl apply -f k8s/site/
kubectl rollout restart deploy/site

# 3. Relancer le tunnel vers le nouveau pod
pkill -f "port-forward svc/site"
kubectl rollout status deploy/site
kubectl port-forward svc/site 8080:80 > /tmp/site.log 2>&1 &
